name: Publish VS Code Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

defaults:
  run:
    working-directory: extension

jobs:
  publish:
    name: Publish to Visual Studio Marketplace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Require VSCE_PAT
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Add repository secret VSCE_PAT from https://marketplace.visualstudio.com/manage"
            exit 1
          fi

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run publish:marketplace

      - name: Upload published VSIX
        uses: actions/upload-artifact@v4
        with:
          name: auto-gitmoji-docs-marketplace
          path: extension/*.vsix
          if-no-files-found: error
          retention-days: 30
