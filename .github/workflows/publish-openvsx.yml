name: Publish Open VSX

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "cli/**"
      - ".github/workflows/publish-openvsx.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-openvsx
  cancel-in-progress: false

defaults:
  run:
    working-directory: extension

jobs:
  publish:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Open VSX metadata
        run: npm run openvsx:check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Require OVSX_PAT
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "Add repository secret OVSX_PAT from https://open-vsx.org/user-settings/tokens"
            exit 1
          fi

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npm run publish:ovsx

      - name: Verify public Open VSX version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const url = `https://open-vsx.org/api/${pkg.publisher}/${pkg.name}/${pkg.version}`;
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              // Avoid a cached 404 from an earlier check while the upload became visible.
              const checkUrl = `${url}?verification=${Date.now()}`;
              const response = await fetch(checkUrl, {
                headers: { 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(15000)
              });
              if (response.ok) {
                const published = await response.json();
                if (published.namespace === pkg.publisher && published.name === pkg.name && published.version === pkg.version) {
                  console.log(`Verified public version: ${pkg.publisher}.${pkg.name}@${pkg.version}`);
                  process.exit(0);
                }
              }
            } catch (error) {
              console.log(`Registry check ${attempt + 1} failed: ${error.message}`);
            }
            if (attempt < 5) await setTimeout(10000);
          }
          throw new Error(`Uploaded version is not publicly available: ${url}`);
          NODE

      - name: Upload published VSIX
        uses: actions/upload-artifact@v4
        with:
          name: auto-gitmoji-docs-openvsx
          path: extension/*.vsix
          if-no-files-found: error
          retention-days: 30
